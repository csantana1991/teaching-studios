<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Board Studio</title>
</head>
<body>
<script>
(async function () {
  const src = "https://raw.githubusercontent.com/csantana1991/grok-studio-11/befd3ea78e6cf35f5a9fba1be6aa324a4059a951/public/studio/NucMed-Board-Studio.html";
  const res = await fetch(src);
  let html = await res.text();
  html = html
    .replace("top: 118px !important;", "top: 148px !important;")
    .replace("width: min(520px, 42vw) !important;", "width: min(380px, 32vw) !important;")
    .replace("height: min(380px, 48vh) !important;", "height: auto !important; max-height: 46vh !important;")
    .replace("body.scan-live.medb-full #phraseDef:not(:has(article)) { display: none !important; }", "body.scan-live.medb-full #phraseDef { display: flex !important; animation: none !important; transition: none !important; }")
    .replace('Array.from(defs.querySelectorAll("article")).forEach((node) => node.remove());', 'if (!document.body.classList.contains("medb-full")) Array.from(defs.querySelectorAll("article")).forEach((node) => node.remove());')
    .replace('if (typeof ScanLive !== "undefined") ScanLive.seenPhrase = {};', 'if (typeof ScanLive !== "undefined" && !document.body.classList.contains("medb-full")) ScanLive.seenPhrase = {};');
  const extra = '<script id="medLectureTerms">setInterval(function(){if(typeof ScanLive==="undefined"||ScanLive.__lectureTerms)return;ScanLive.__lectureTerms=1;var heart=/heart|ecg|ekg|arrhythm|cardio|sinus rhythm|tachycard|bradycard|qrs|electrocardi/i;ScanLive.nextTerm=function(){var said=document.getElementById("hjSaid");var page="";try{var doc=document.getElementById("mbFrame").contentDocument;if(doc)page=Array.prototype.map.call(doc.querySelectorAll("h1,h2"),function(n){return n.textContent;}).join(" ");}catch(e){}var topic=((said&&said.value)||"")+" "+((typeof CapRail!=="undefined"&&(CapRail.topic||""))||"")+" "+page;topic=topic.replace(/\s+/g," ").trim();var heartLecture=heart.test(topic);var lines=[];var cues=(typeof CapRail!=="undefined"&&CapRail.cues)||[];cues.forEach(function(c){var t=String((c&&c.text)||c||"").replace(/\s+/g," ").trim();if(t.length>12)lines.push(t);});topic.replace(/fellowship|residency|lecture|introduction|board studio/ig," ").split(/[\u00b7|,]/).forEach(function(bit){bit=bit.replace(/\s+/g," ").trim();if(bit.length>4)lines.unshift(bit);});if(heartLecture)lines.push("electrocardiography","sinus rhythm","heart rate");if(!lines.length)lines.push(topic||"abdominal imaging");this.keepNext();if(!heartLecture){var host=document.getElementById("phraseDef");if(host)Array.prototype.forEach.call(host.querySelectorAll("article"),function(node){if(heart.test(node.textContent||""))node.remove();});}var start=this.termAt||0;for(var n=0;n<lines.length;n++){var i=(start+n)%lines.length;var line=lines[i];if(!heartLecture&&heart.test(line))continue;var term=this.livePhrase(line);if(!term||term.length<4||this.termsSeen[term])continue;if(!heartLecture&&heart.test(term))continue;this.termsSeen[term]=1;this.termAt=(i+1)%lines.length;var btn=document.getElementById("phraseNext");if(btn)btn.textContent="Next \u00b7 "+term;delete this.seenPhrase[line.toLowerCase().slice(0,160)];this.phrase(line);return;}this.termsSeen={};this.termAt=0;};},400);<\/script>';
  html = html.replace("</body>", extra + "<script id=\"medFitStable\">(function(){function fit(){if(!document.body.classList.contains('medb-full'))return;var frame=document.getElementById('mbFrame');if(!frame)return;var doc;try{doc=frame.contentDocument;}catch(e){return;}if(!doc||!doc.head)return;var style=doc.getElementById('medFitBox');if(!style){style=doc.createElement('style');style.id='medFitBox';doc.head.appendChild(style);}style.textContent='.studio-rail{display:none!important}.studio-shell{padding-left:0!important}.learning-grid{display:block!important}.player-column,.media-player{width:100%!important;max-width:none!important;overflow:visible!important}.player-surface{width:min(100%,calc((100vh - 220px) * 1.777))!important;max-width:100%!important;aspect-ratio:16/9!important;height:auto!important;position:relative!important;margin:0!important;overflow:hidden!important}.youtube-mount,.vimeo-mount,.youtube-mount iframe,.vimeo-mount iframe{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;border:0!important}';}setInterval(fit,800);fit();})();<\/script></body>");
  document.open();
  document.write(html);
  document.close();
})();
</script>
</body>
</html>
