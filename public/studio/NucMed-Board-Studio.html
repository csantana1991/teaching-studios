<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Board Studio</title>
</head>
<body>
<script>
(async function () {
  const src = "https://raw.githubusercontent.com/csantana1991/grok-studio-11/befd3ea78e6cf35f5a9fba1be6aa324a4059a951/public/studio/NucMed-Board-Studio.html";
  const res = await fetch(src);
  let html = await res.text();
  html = html
    .replace("top: 118px !important;", "top: 214px !important;")
    .replace("width: min(520px, 42vw) !important;", "width: min(400px, 32vw) !important;")
    .replace("height: min(380px, 48vh) !important;", "height: min(280px, 38vh) !important;");
  document.open();
  document.write(html);
  document.close();
})();
</script>
</body>
</html>
