<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Board Studio</title>
</head>
<body>
<script>
(async function () {
  const src = "https://raw.githubusercontent.com/csantana1991/grok-studio-11/befd3ea78e6cf35f5a9fba1be6aa324a4059a951/public/studio/NucMed-Board-Studio.html";
  const res = await fetch(src);
  let html = await res.text();
  html = html
    .replace("top: 118px !important;", "top: 168px !important;")
    .replace("width: min(520px, 42vw) !important;", "width: min(420px, 36vw) !important;")
    .replace("height: min(380px, 48vh) !important;", "height: min(320px, 42vh) !important;")
    .replace("body.scan-live.medb-full #phraseDef:not(:has(article)) { display: none !important; }", "body.scan-live.medb-full #phraseDef { display: flex !important; }")
    .replace('Array.from(defs.querySelectorAll("article")).forEach((node) => node.remove());', 'if (!document.body.classList.contains("medb-full")) Array.from(defs.querySelectorAll("article")).forEach((node) => node.remove());')
    .replace('if (typeof ScanLive !== "undefined") ScanLive.seenPhrase = {};', 'if (typeof ScanLive !== "undefined" && !document.body.classList.contains("medb-full")) ScanLive.seenPhrase = {};');
  document.open();
  document.write(html);
  document.close();
})();
</script>
</body>
</html>
